<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的排班</title>
<style>
body { font-family: Arial; margin: 0; padding: 10px; text-align: center; }
h2 { margin: 10px 0; }
.calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.day { border: 1px solid #ccc; padding: 10px 0; min-height: 60px; cursor: pointer; font-size: 14px; position: relative; }
.day.disabled { color: #ccc; cursor: default; }
.shift { display: block; margin-top: 5px; font-size: 12px; font-weight: bold; }
.controls { margin-bottom: 10px; }
button { padding: 5px 10px; cursor: pointer; }
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
</style>
</head>

<body>

<h2 id="monthYear"></h2>

<div class="controls">
<button onclick="changeMonth(-1)">⬅ 上月</button>
<button onclick="changeMonth(1)">下月 ➡</button>
</div>

<div class="calendar" id="calendar"></div>

<script>
let currentDate = new Date();

function renderCalendar() {
    const calendar = document.getElementById("calendar");
    calendar.innerHTML = "";

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("monthYear").innerText = year + "年 " + (month + 1) + "月";

    // 星期标题
    const weekdays = ["日","一","二","三","四","五","六"];
    weekdays.forEach(w => {
        const div = document.createElement("div");
        div.style.fontWeight = "bold";
        div.style.padding = "5px 0";
        div.innerText = w;
        calendar.appendChild(div);
    });

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    // 上月最后几天
    const prevMonthDays = new Date(year, month, 0).getDate();
    for (let i = firstDay - 1; i >= 0; i--) {
        const div = document.createElement("div");
        div.className = "day disabled";
        div.innerText = prevMonthDays - i;
        calendar.appendChild(div);
    }

    const today = new Date();

    // 本月日期
    for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = `${year}-${month+1}-${day}`;
        const div = document.createElement("div");
        div.className = "day";
        div.innerHTML = day;

        // 今天高亮
        if(day === today.getDate() && month === today.getMonth() && year === today.getFullYear()){
            div.style.border = "2px solid blue";
            div.style.borderRadius = "10px";
        }

        const saved = localStorage.getItem(dateKey);
        if (saved) {
            const span = document.createElement("span");
            span.className = "shift " + saved;
            span.innerText = getShiftText(saved);
            if(saved==="day") span.style.color="green";
            if(saved==="night") span.style.color="orange";
            if(saved==="full") span.style.color="blue";
            div.appendChild(span);
        }

        div.onclick = function() { showShiftSelector(dateKey); };
        calendar.appendChild(div);
    }

    // 下月前几天，填充最后一行
    let totalCells = firstDay + daysInMonth;
    let nextDays = 7 - (totalCells % 7);
    if(nextDays < 7){
        for(let i=1;i<=nextDays;i++){
            const div = document.createElement("div");
            div.className = "day disabled";
            div.innerText = i;
            calendar.appendChild(div);
        }
    }
}

function getShiftText(type) {
    if(type==="day") return "日班";
    if(type==="night") return "夜班";
    if(type==="full") return "全天班";
    return "";
}

// 弹出按钮选择班次
function showShiftSelector(dateKey){
    const popup = document.createElement("div");
    popup.style.position = "fixed";
    popup.style.top = "50%";
    popup.style.left = "50%";
    popup.style.transform = "translate(-50%, -50%)";
    popup.style.background = "#fff";
    popup.style.border = "1px solid #ccc";
    popup.style.borderRadius = "10px";
    popup.style.padding = "20px";
    popup.style.zIndex = 1000;
    popup.style.textAlign = "center";
    popup.style.boxShadow = "0 4px 10px rgba(0,0,0,0.3)";

    const title = document.createElement("div");
    title.innerText = "选择班次";
    title.style.marginBottom = "10px";
    title.style.fontWeight = "bold";
    popup.appendChild(title);

    const shifts = [
        {name: "日班", type: "day", color: "green"},
        {name: "夜班", type: "night", color: "orange"},
        {name: "全天班", type: "full", color: "blue"},
        {name: "清除", type: "clear", color: "red"}
    ];

    shifts.forEach(s=>{
        const btn = document.createElement("button");
        btn.innerText = s.name;
        btn.style.margin = "5px";
        btn.style.padding = "10px 15px";
        btn.style.border = "none";
        btn.style.borderRadius = "5px";
        btn.style.background = s.color;
        btn.style.color = "#fff";
        btn.style.fontWeight = "bold";
        btn.onclick = ()=>{
            if(s.type==="clear") localStorage.removeItem(dateKey);
            else localStorage.setItem(dateKey,s.type);
            document.body.removeChild(popup);
            renderCalendar();
        };
        popup.appendChild(btn);
    });

    document.body.appendChild(popup);
}

// 月份切换
function changeMonth(num){
    currentDate.setMonth(currentDate.getMonth()+num);
    renderCalendar();
}

renderCalendar();
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
